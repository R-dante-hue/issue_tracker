{% extends 'webapp/base.html' %}
{% block content %}
<h1>{{ issue.summary }}</h1>
<p>Статус: {{ issue.status.name }}</p>
<p>Проект: {{ issue.project.title }}</p>
<p>{{ issue.description }}</p>
<a href="{% url 'issue_update' issue.pk %}" class="btn btn-warning">Ред.</a>
<a href="{% url 'issue_delete' issue.pk %}" class="btn btn-danger">Удалить</a>
<a href="{% url 'project_detail' issue.project.pk %}" class="btn btn-secondary">Назад</a>
{% endblock %}
