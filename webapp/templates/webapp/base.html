<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Issue Tracker{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'project_list' %}">Трекер</a>
        <div class="navbar-nav">
            <a class="nav-link" href="{% url 'project_list' %}">Проекты</a>
            {% if user.is_authenticated %}
            <a class="nav-link" href="{% url 'project_create' %}">Создать проект</a>
            <form method="post" action="{% url 'accounts:logout' %}" style="display:inline">
                {% csrf_token %}
                <button type="submit" class="nav-link btn btn-link" style="padding:8px">Выход ({{ user.username }})</button>
            </form>
            {% else %}
            <a class="nav-link" href="{% url 'accounts:login' %}">Вход</a>
            <a class="nav-link" href="{% url 'accounts:register' %}">Регистрация</a>
            {% endif %}
        </div>
    </div>
</nav>
    <div class="container">{% block content %}{% endblock %}</div>
</body>
</html>
